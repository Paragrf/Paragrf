name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Paragrf
          template: classic
          base: "" # 不生成基础统计，只生成奖杯
          plugin_achievements: yes
          plugin_achievements_threshold: C # 只有达到一定等级才展示
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact # 紧凑模式
